spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  datasource:
    url: jdbc:h2:mem:maindb

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql

  output:
    ansi:
      enabled: ALWAYS

  data:
    rest:
      base-path: /datarest

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, loggers, prometheus
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  level:
    root: info
    ru.otus.hw: DEBUG