global:
  scrape_interval: 15s          # частота сборки метрики
  evaluation_interval: 15s      # как часто оценивать правила

scrape_configs:
  - job_name: 'library-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['library-server:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']