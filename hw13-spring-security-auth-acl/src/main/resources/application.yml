spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    defer-datasource-initialization: true
  datasource:
    url: jdbc:h2:mem:maindb
    username: 123
    password: 123

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false

  output:
    ansi:
      enabled: ALWAYS

logging:
  level:
    org.springframework.security: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.transaction: TRACE

app:
  admin:
    username: admin
    password: password